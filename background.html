<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background - Esquadrias e Vidraçaria</title>
    <style>
        /* Reset e configuração básica */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Remove barras de rolagem */
            /* Fundo atualizado para preto conforme a paleta */
            background-color: #000000;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* O canvas atua como background absoluto */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>

<body>

    <!-- Canvas onde a animação acontece -->
    <canvas id="bg-canvas"></canvas>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let frames = [];
        let profiles = [];

        // Cores temáticas atualizadas com a nova paleta
        const palette = {
            baseDark: '#005c99',
            baseMid: '#007acc',
            baseLight: '#3399ff',
            background: '#000000'
        };

        // Função para converter hex para rgba para trabalhar com transparência
        function hexToRgba(hex, alpha) {
            let r = parseInt(hex.slice(1, 3), 16),
                g = parseInt(hex.slice(3, 5), 16),
                b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // Ajusta o canvas para o tamanho da tela
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Classe representando os "Perfis de Alumínio" (Linhas longas contínuas)
        class ProfileLine {
            constructor() {
                this.isVertical = Math.random() > 0.5;
                this.reset();
            }

            reset() {
                if (this.isVertical) {
                    this.x = Math.random() * width;
                    this.y = 0;
                    this.vx = (Math.random() - 0.5) * 0.5; // Move levemente para os lados
                    this.vy = 0;
                } else {
                    this.x = 0;
                    this.y = Math.random() * height;
                    this.vx = 0;
                    this.vy = (Math.random() - 0.5) * 0.5; // Move levemente para cima/baixo
                }
                this.thickness = Math.random() * 1.5 + 0.5;
                this.opacity = Math.random() * 0.4 + 0.1;
                // Escolhe aleatoriamente uma cor da paleta para as linhas
                this.color = Math.random() > 0.5 ? palette.baseDark : palette.baseMid;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Reinicia se sair da tela
                if (this.isVertical && (this.x < -50 || this.x > width + 50)) this.reset();
                if (!this.isVertical && (this.y < -50 || this.y > height + 50)) this.reset();
            }

            draw() {
                ctx.beginPath();
                if (this.isVertical) {
                    ctx.moveTo(this.x, 0);
                    ctx.lineTo(this.x, height);
                } else {
                    ctx.moveTo(0, this.y);
                    ctx.lineTo(width, this.y);
                }
                ctx.strokeStyle = hexToRgba(this.color, this.opacity);
                ctx.lineWidth = this.thickness;
                ctx.setLineDash([]); // Linha sólida
                ctx.stroke();
            }
        }

        // Classe representando as Janelas/Esquadrias com painéis de vidro
        class WindowFrame {
            constructor() {
                this.reset();
                // Posiciona aleatoriamente na primeira vez espalhado pela tela
                this.x = Math.random() * width;
                this.y = Math.random() * height;
            }

            reset() {
                // Dimensões geométricas retangulares (formato de porta/janela)
                this.w = Math.random() * 200 + 100;
                this.h = Math.random() * 300 + 150;

                // Ponto de surgimento
                this.x = Math.random() > 0.5 ? -this.w : width + this.w;
                this.y = Math.random() * height;

                // Movimentação de "correr" (horizontal ou vertical suave)
                this.vx = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 0.8 + 0.2);
                this.vy = (Math.random() - 0.5) * 0.2; // Quase estático no eixo Y

                // Variáveis para o efeito de desenhar e apagar
                this.perimeter = (this.w * 2) + (this.h * 2);
                this.drawPhase = Math.random() * Math.PI * 2; // Início aleatório do ciclo senoidal
                this.drawSpeed = Math.random() * 0.01 + 0.005;

                // Divisórias internas (montantes)
                this.hasMullionX = Math.random() > 0.3;
                this.hasMullionY = Math.random() > 0.5;
                this.mullionXPos = this.w * (Math.random() * 0.4 + 0.3); // 30% a 70%
                this.mullionYPos = this.h * (Math.random() * 0.4 + 0.3);

                // Define as cores específicas para esta esquadria baseadas na paleta
                this.glassColor = palette.baseDark;
                this.frameColor = palette.baseLight;
                this.mullionColor = palette.baseMid;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.drawPhase += this.drawSpeed;

                // Se saiu completamente da tela, reseta
                if (
                    (this.vx > 0 && this.x > width + 100) ||
                    (this.vx < 0 && this.x < -this.w - 100) ||
                    this.y > height + 100 || this.y < -this.h - 100
                ) {
                    this.reset();
                }
            }

            draw() {
                // Cálculo de oscilação para desenhar/apagar (0.0 a 1.0)
                let progress = (Math.sin(this.drawPhase) + 1) / 2;
                let currentDrawLength = this.perimeter * progress;

                // 1. Desenha o fundo de "Vidro" com transparência baseada na oscilação
                // Usa baseDark para um efeito mais profundo
                let glassAlpha = progress > 0.8 ? 0.15 : 0.05;
                ctx.fillStyle = hexToRgba(this.glassColor, glassAlpha);
                ctx.fillRect(this.x, this.y, this.w, this.h);

                // 2. Configura a caneta para as esquadrias perimetrais
                // Usa baseLight para o contorno brilhante
                ctx.strokeStyle = hexToRgba(this.frameColor, 0.7);
                ctx.lineWidth = 1.5;

                // Efeito de linha se fazendo/desfazendo no perímetro
                ctx.setLineDash([this.perimeter]);
                ctx.lineDashOffset = this.perimeter - currentDrawLength;

                ctx.strokeRect(this.x, this.y, this.w, this.h);

                // Restaura linha para os montantes internos
                ctx.setLineDash([]);
                ctx.lineWidth = 1;
                // Usa baseMid para os montantes internos
                ctx.strokeStyle = hexToRgba(this.mullionColor, 0.5);

                // 3. Desenha divisórias internas acompanhando a transparência global
                ctx.globalAlpha = progress;

                if (this.hasMullionX) {
                    ctx.beginPath();
                    ctx.moveTo(this.x + this.mullionXPos, this.y);
                    ctx.lineTo(this.x + this.mullionXPos, this.y + this.h);
                    ctx.stroke();
                }

                if (this.hasMullionY) {
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y + this.mullionYPos);
                    ctx.lineTo(this.x + this.w, this.y + this.mullionYPos);
                    ctx.stroke();
                }

                ctx.globalAlpha = 1.0; // Reseta alpha
            }
        }

        // Inicializa os elementos
        function init() {
            frames = [];
            profiles = [];

            // Quantidade de painéis/esquadrias
            for (let i = 0; i < 15; i++) {
                frames.push(new WindowFrame());
            }

            // Quantidade de linhas guias cruzando a tela
            for (let i = 0; i < 10; i++) {
                profiles.push(new ProfileLine());
            }
        }

        // Loop principal de animação
        function animate() {
            // Limpa a tela frame a frame
            ctx.clearRect(0, 0, width, height);

            // Desenha as linhas estruturais (fundo)
            profiles.forEach(profile => {
                profile.update();
                profile.draw();
            });

            // Desenha os painéis e esquadrias (frente)
            frames.forEach(frame => {
                frame.update();
                frame.draw();
            });

            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>
</body>

</html>
